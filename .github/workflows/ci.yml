name: CI
on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # 'min' tracks the julia lower bound in Project.toml instead of
          # restating it, so the two cannot drift apart. It resolves to 1.10
          # today, which is also what compile.yml builds the released binaries
          # with; 'lts' and '1' catch upstream breakage early.
          - 'min'
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          # 'default', not 'x64': macos-latest is Apple Silicon, and
          # julia-actions/setup-julia v3 errors on an explicit x64 request there
          # rather than quietly using an x64 build as v2 did. 'default' gives x64
          # on ubuntu and windows and aarch64 on macOS, which is what macOS users
          # actually run.
          - default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
