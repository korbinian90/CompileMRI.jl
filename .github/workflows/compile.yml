name: Compile
on:
  release:
    types: [published]
  # Lets the whole matrix be built and smoke-tested without publishing a
  # release. Until this existed, compile.yml only ever ran on `release:
  # published`, so a broken build was discovered by the release itself.
  workflow_dispatch:
    inputs:
      julia_version:
        description: 'Julia version to build with. Only affects manual runs - a published release always builds with the default.'
        required: false
        default: '1.10'
permissions:
  contents: write   # required to attach the built binaries to the release
jobs:
  compile:
    name: ${{ matrix.label }} - ${{ matrix.os }} - Julia ${{ inputs.julia_version || '1.10' }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    outputs:
      # Every matrix entry reads the same App/Project.toml, so which one wins is
      # immaterial. This keeps mritools_version() the single source of the
      # version rather than re-deriving it in the job below.
      version: ${{ steps.version.outputs.version }}
    env:
      # The input default only applies to workflow_dispatch. On `release:
      # published` there are no inputs, so `inputs.julia_version` is empty and
      # this fallback is what actually supplies the version - without it a
      # release would hand setup-julia an empty string. Defined once here
      # rather than per matrix entry; `env` is not available in `strategy`,
      # which is why the version is no longer a matrix key at all.
      JULIA_VERSION: ${{ inputs.julia_version || '1.10' }}
    strategy:
      fail-fast: false
      matrix:
        # One build per platform+architecture, and no more. Verified against
        # the shipped v4.7.1 assets rather than assumed:
        #
        # Linux - the whole bundle's glibc floor comes from the runner, not from
        # Julia (Julia's own libraries need only GLIBC_2.17). Measured: the
        # ubuntu-22.04 bundle needs GLIBC_2.34, the ubuntu-24.04 one needs 2.38.
        # glibc is forward compatible, so the 22.04 build runs everywhere the
        # 24.04 build does plus RHEL 9, Debian 12 and Ubuntu 22.04, which the
        # 24.04 build cannot. ubuntu-24.04 was therefore pure redundancy.
        #
        # Windows - windows-2022 and windows-2025 produced byte-different but
        # compatibility-identical binaries: same machine, minOS 4.0, subsystem
        # 5.2. Three Windows builds bought nothing.
        #
        # macOS - the only platform where the runner choice really matters,
        # because minos is stamped from the build host: the macOS-13 build
        # reported minos 13.0 and the macOS-15 build 15.0, so a binary built on
        # a newer macOS will not start on an older one. Hence the OLDEST usable
        # runner per architecture.
        #   macos-14 is deprecated and will be removed. It is kept deliberately:
        #   it yields minos 14.0 where macos-15 would give 15.0. When the image
        #   disappears this job fails and we move to macos-15 then.
        #   For Intel there is no free equivalent - macos-13 is gone and the
        #   macOS 14 Intel image exists only as macos-14-large, a larger runner,
        #   which is billed even on public repositories. macos-15-intel is the
        #   oldest free Intel runner, so Intel Macs on macOS 13/14 cannot be
        #   served at all.
        #
        # The Linux entry builds inside an old-glibc container. The bundle's
        # glibc floor comes from whatever links it, not from Julia: Julia's own
        # libraries need at most GLIBC_2.17, while the v4.7.1 ubuntu-22.04 asset
        # required 2.34 and the ubuntu-24.04 one 2.38. 2.34 is not arbitrary -
        # glibc 2.34 merged libpthread/libdl/librt into libc and re-versioned
        # those symbols, so anything linked against glibc >= 2.34 inherits it,
        # and a program doing nothing but pthread_create + dlopen already does.
        # ubuntu-20.04 is retired and ubuntu-22.04 (2.35) is the oldest runner,
        # so the runner cannot go lower - the container can.
        #
        # docker run, not `container:` on the job: GitHub's JavaScript actions
        # need node inside the container and node 20/24 wants glibc >= 2.28,
        # which would exclude exactly the old images that make this worthwhile.
        # Running only the compile in the container avoids that.
        include:
          - {os: ubuntu-22.04,   arch: x64,     label: linux_x64,   container: 'quay.io/pypa/manylinux2014_x86_64'}
          - {os: windows-2025,   arch: x64,     label: windows_x64, container: ''}
          - {os: macos-15-intel, arch: x64,     label: macos_x64,   container: ''}
          - {os: macos-14,       arch: aarch64, label: macos_arm64, container: ''}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ env.JULIA_VERSION }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - name: Compile
        if: ${{ matrix.container == '' }}
        run: julia --color=yes --project=@. -e 'using CompileMRI; compile()'

      - name: Compile in ${{ matrix.container }}
        if: ${{ matrix.container != '' }}
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -e JULIA_NUM_THREADS=2 \
            '${{ matrix.container }}' bash -euo pipefail -c '
              curl -fsSL "https://julialang-s3.julialang.org/bin/linux/x64/${{ env.JULIA_VERSION }}/julia-${{ env.JULIA_VERSION }}-latest-linux-x86_64.tar.gz" -o /tmp/julia.tar.gz
              mkdir -p /opt/julia
              tar -xzf /tmp/julia.tar.gz -C /opt/julia --strip-components=1
              export PATH=/opt/julia/bin:$PATH
              julia --version
              julia --color=yes --project=. -e "using Pkg; Pkg.instantiate(); using CompileMRI; compile()"
            '
          sudo chown -R "$(id -u):$(id -g)" compiled

      - name: Report the glibc floor
        if: ${{ matrix.container != '' }}
        run: |
          max=$(find compiled -type f \( -name '*.so*' -o -perm -u+x \) \
                  -exec sh -c 'objdump -T "$1" 2>/dev/null | grep -oE "GLIBC_[0-9.]+"' _ {} \; \
                | sort -uV | tail -1)
          echo "max GLIBC required across the bundle: ${max:-none}"
          echo "**Linux glibc floor:** \`${max:-none}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Ad-hoc sign the bundle (macOS)
        # Apple Silicon refuses to execute a Mach-O carrying no signature at
        # all, so this is what makes the arm64 build runnable rather than a
        # cosmetic step. It is not a paid Developer ID signature and does not
        # satisfy Gatekeeper, so a downloaded bundle still needs its quarantine
        # flag cleared - README_macOS.txt covers that.
        #
        # Every Mach-O is signed individually. --deep is deprecated, and there
        # is no .app bundle here, just bin/ and lib/.
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          # Julia installs its artifact store read-only, and PackageCompiler
          # copies it in with those modes. Extended attributes cannot be set or
          # cleared on a file without write permission, so a user running the
          # documented xattr -cr against the extracted bundle got
          # "Permission denied" on every artifact file and left the quarantine
          # flags there. Measured on this bundle: the FFTW artifact under
          # share/julia/artifacts. Making the tree user-writable before it is
          # archived is what lets the instructions work without sudo.
          chmod -R u+w compiled
          n=0
          while IFS= read -r f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f"
              n=$((n + 1))
            fi
          done < <(find compiled -type f)
          echo "ad-hoc signed $n Mach-O files"
          # A signature that does not verify is worse than none: it would fail
          # at launch rather than at build time.
          while IFS= read -r f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --verify --strict "$f"
            fi
          done < <(find compiled -type f)
          echo "all signatures verify"

      - name: Get Version
        id: version
        shell: bash
        run: echo "version=$(julia --project=@. -e 'using CompileMRI; println(CompileMRI.mritools_version())')" >> "$GITHUB_OUTPUT"
      - name: Check the release tag matches the App version
        # The archive names come from App/Project.toml via mritools_version().
        # Tagging a version that Project.toml has not been bumped to would
        # publish a release whose assets are all named after the old version,
        # silently.
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          tag='${{ github.event.release.tag_name }}'
          ver='${{ steps.version.outputs.version }}'
          if [ "$tag" != "v$ver" ]; then
            echo "::error::release tag '$tag' does not match App/Project.toml version '$ver' (expected tag 'v$ver')"
            exit 1
          fi
          echo "tag $tag matches version $ver"
      - name: Compress Unix
        # Both formats ship. xz is 40% smaller than gzip on this bundle
        # (measured on the v4.8.0 Linux tree: 173.5 MB at gzip -6, 104.5 MB at
        # xz -6), and every tar that can read one of these can read the other.
        # The .tar.gz stays because downloaders elsewhere fetch it by name; it
        # can be dropped once they have moved.
        #
        # The default xz preset, not -9: -9 saves a further 4 MB but needs a
        # 64 MB dictionary to decompress instead of 8 MB, which is a bad trade
        # to push onto whoever is unpacking it.
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          name=mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}
          mv compiled "$name"
          tar -czf "$name.tar.gz" "$name"
          XZ_OPT=-T0 tar -cJf "$name.tar.xz" "$name"
          ls -l "$name.tar.gz" "$name.tar.xz"
          {
            echo "RELEASE_ASSETS<<EOF"
            echo "$name.tar.gz"
            echo "$name.tar.xz"
            echo "EOF"
          } >> $GITHUB_ENV
      - name: Compress Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "RELEASE_ASSETS=mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}.zip" >> $env:GITHUB_ENV
          Compress-Archive -Path 'compiled/*' -DestinationPath 'mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}.zip'
      - name: Upload release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.RELEASE_ASSETS }}
      - name: Upload artifact
        # The Julia version is in the artifact name, not the archive name: a
        # manual run exists to compare toolchains, and two runs on different
        # Julia versions would otherwise produce identically named bundles.
        # Uploaded on every trigger, not just dispatch: the macOS install
        # check below consumes this artifact, and it has to run on release
        # builds above all.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}_julia${{ env.JULIA_VERSION }}
          path: ${{ env.RELEASE_ASSETS }}

  verify_macos:
    # Runs the install exactly as README_macOS.txt tells a user to, on both
    # architectures, so the instructions are executed rather than asserted.
    name: macOS install check - ${{ matrix.label }}
    needs: compile
    runs-on: ${{ matrix.os }}
    permissions:
      # The workflow grants contents: write for the release upload, and a
      # permissions block sets every scope it does not name to none. Downloading
      # the artifact needs actions: read, so this job states its own.
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, label: macos_x64}
          - {os: macos-14,       label: macos_arm64}
    env:
      BUNDLE: mritools_${{ matrix.label }}_${{ needs.compile.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mritools_${{ matrix.label }}_${{ needs.compile.outputs.version }}_julia${{ inputs.julia_version || '1.10' }}

      - name: Extract as the README tells a user to
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "$BUNDLE.tar.xz"
          test -f "$BUNDLE/README_macOS.txt" || { echo "::error::README_macOS.txt is missing from the bundle"; exit 1; }

      - name: The ad-hoc signatures survived archiving
        shell: bash
        run: |
          set -euo pipefail
          for app in romeo clearswi mcpc3ds makehomogeneous romeo_mask; do
            test -x "$BUNDLE/bin/$app" || { echo "::error::$app is missing or not executable"; exit 1; }
            codesign --verify --strict "$BUNDLE/bin/$app"
            echo "  $app signed and verified"
          done

      - name: Clearing quarantine works, as documented
        # A downloaded archive carries com.apple.quarantine and propagates it to
        # everything Archive Utility extracts. Nothing in CI arrives through a
        # browser, so the flag is set here deliberately - otherwise this step
        # would pass without ever exercising what it claims to.
        shell: bash
        run: |
          set -euo pipefail
          xattr -w -r com.apple.quarantine "0081;00000000;Safari;" "$BUNDLE"
          xattr -pr com.apple.quarantine "$BUNDLE/bin/romeo" >/dev/null \
            || { echo "::error::could not set the quarantine flag, the check below would prove nothing"; exit 1; }
          xattr -cr "$BUNDLE"
          if xattr -pr com.apple.quarantine "$BUNDLE" 2>/dev/null | grep -q .; then
            echo "::error::xattr -cr left a quarantine flag behind, README_macOS.txt is wrong"
            exit 1
          fi
          echo "quarantine set, then cleared by the documented command"

      - name: The extracted bundle still computes
        # The same invocation CompileMRI.test runs during the build, but against
        # the bundle a user actually gets: extracted from the archive, signed,
        # and with the quarantine flag cleared. --help would only prove the
        # binary starts.
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          "$BUNDLE/bin/romeo" -p test/data/small/Phase.nii -o "$out" -t 1:3 -k nomask
          test -f "$out/unwrapped.nii" || { echo "::error::romeo produced no unwrapped.nii"; exit 1; }
          echo "romeo ran on the test data and wrote $(ls "$out" | tr '\n' ' ')"
