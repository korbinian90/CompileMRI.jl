name: Compile
on:
  release:
    types: [published]
  # Lets the whole matrix be built and smoke-tested without publishing a
  # release. Until this existed, compile.yml only ever ran on `release:
  # published`, so a broken build was discovered by the release itself.
  workflow_dispatch:
permissions:
  contents: write   # required to attach the built binaries to the release
jobs:
  compile:
    name: ${{ matrix.label }} - ${{ matrix.os }} - Julia ${{ matrix.version }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One build per platform+architecture, and no more. Verified against
        # the shipped v4.7.1 assets rather than assumed:
        #
        # Linux - the whole bundle's glibc floor comes from the runner, not from
        # Julia (Julia's own libraries need only GLIBC_2.17). Measured: the
        # ubuntu-22.04 bundle needs GLIBC_2.34, the ubuntu-24.04 one needs 2.38.
        # glibc is forward compatible, so the 22.04 build runs everywhere the
        # 24.04 build does plus RHEL 9, Debian 12 and Ubuntu 22.04, which the
        # 24.04 build cannot. ubuntu-24.04 was therefore pure redundancy.
        #
        # Windows - windows-2022 and windows-2025 produced byte-different but
        # compatibility-identical binaries: same machine, minOS 4.0, subsystem
        # 5.2. Three Windows builds bought nothing.
        #
        # macOS - the only platform where the runner choice really matters,
        # because minos is stamped from the build host: the macOS-13 build
        # reported minos 13.0 and the macOS-15 build 15.0, so a binary built on
        # a newer macOS will not start on an older one. Hence the OLDEST usable
        # runner per architecture.
        #   macos-14 is deprecated and will be removed. It is kept deliberately:
        #   it yields minos 14.0 where macos-15 would give 15.0. When the image
        #   disappears this job fails and we move to macos-15 then.
        #   For Intel there is no free equivalent - macos-13 is gone and the
        #   macOS 14 Intel image exists only as macos-14-large, a larger runner,
        #   which is billed even on public repositories. macos-15-intel is the
        #   oldest free Intel runner, so Intel Macs on macOS 13/14 cannot be
        #   served at all.
        include:
          - {os: ubuntu-22.04,   arch: x64,     label: linux_x64,   version: '1.10'}
          - {os: windows-2025,   arch: x64,     label: windows_x64, version: '1.10'}
          - {os: macos-15-intel, arch: x64,     label: macos_x64,   version: '1.10'}
          - {os: macos-14,       arch: aarch64, label: macos_arm64, version: '1.10'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - name: Compile
        run: julia --color=yes --project=@. -e 'using CompileMRI; compile()'
      - name: Get Version
        id: version
        shell: bash
        run: echo "version=$(julia --project=@. -e 'using CompileMRI; println(CompileMRI.mritools_version())')" >> "$GITHUB_OUTPUT"
      - name: Check the release tag matches the App version
        # The archive names come from App/Project.toml via mritools_version().
        # Tagging v4.8.0 while Project.toml still says 4.7.1 would publish a
        # v4.8.0 release whose assets are all named 4.7.1, silently.
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          tag='${{ github.event.release.tag_name }}'
          ver='${{ steps.version.outputs.version }}'
          if [ "$tag" != "v$ver" ]; then
            echo "::error::release tag '$tag' does not match App/Project.toml version '$ver' (expected tag 'v$ver')"
            exit 1
          fi
          echo "tag $tag matches version $ver"
      - name: Compress Unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          echo "ZIP_ENDING=tar.gz" >> $GITHUB_ENV
          echo "ZIP_TYPE=gzip" >> $GITHUB_ENV
          mv compiled mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}
          tar -vczf mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}.tar.gz mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}
      - name: Compress Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "ZIP_ENDING=zip" >> $env:GITHUB_ENV
          echo "ZIP_TYPE=zip" >> $env:GITHUB_ENV
          Compress-Archive -Path 'compiled/*' -DestinationPath 'mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}.zip'
      - name: Upload release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}.${{ env.ZIP_ENDING }}
      - name: Upload artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}
          path: mritools_${{ matrix.label }}_${{ steps.version.outputs.version }}.${{ env.ZIP_ENDING }}
